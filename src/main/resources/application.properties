spring.application.name=portfolio
server.port=${PORT:8080}
# Railway termina el TLS en su proxy: sin esto la app ve las peticiones como HTTP
# y Spring Security no emite HSTS (Strict-Transport-Security).
server.forward-headers-strategy=framework

github.username=adrian0511
github.token=${GITHUB_TOKEN:}
github.cache-ttl-seconds=${GITHUB_CACHE_TTL:600}

# Chat con IA (libreria propia prompt-link -> OpenRouter).
# Sin OPENROUTER_API_KEY el chat responde con su mensaje de respaldo: la web
# sigue funcionando igual, solo que el asistente deriva al email.
ai.api-key=${OPENROUTER_API_KEY:}
ai.model=${AI_MODEL:google/gemma-4-31b-it:free}
ai.max-tokens=600
ai.temperature=0.3
ai.title=adrian0511.dev
ai.host=${AI_HOST:https://adrian0511.dev}
# Con streaming el primer token llega rapido, asi que un timeout de
# inactividad corto es seguro y evita dejar al visitante esperando.
ai.read-timeout=25s
chat.max-messages-per-session=${CHAT_MAX_MESSAGES:20}
