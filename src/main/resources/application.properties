spring.application.name=portfolio
# La app no autentica a nadie (todo permitAll con validacion CSRF propia), asi
# que el usuario en memoria de Spring Security sobra y su password aleatoria
# solo ensucia el log de arranque en produccion.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.ReactiveUserDetailsServiceAutoConfiguration
server.port=${PORT:8080}
# Railway termina el TLS en su proxy: sin esto la app ve las peticiones como HTTP
# y Spring Security no emite HSTS (Strict-Transport-Security).
server.forward-headers-strategy=framework

github.username=adrian0511
github.token=${GITHUB_TOKEN:}
github.cache-ttl-seconds=${GITHUB_CACHE_TTL:600}

# Chat con IA (libreria propia prompt-link -> OpenRouter).
# Sin OPENROUTER_API_KEY el chat responde con su mensaje de respaldo: la web
# sigue funcionando igual, solo que el asistente deriva al email.
ai.api-key=${OPENROUTER_API_KEY:}
# Cambiar de modelo NO necesita despliegue: es AI_MODEL en Railway, y este valor
# solo se aplica si esa variable no esta puesta. Util el dia que el modelo caiga
# (paso con este: 502 durante una hora larga, y el chat respondiendo con el
# mensaje de respaldo a todo visitante hasta que el proveedor se recupero).
ai.model=${AI_MODEL:google/gemma-4-31b-it:free}
ai.max-tokens=600
ai.temperature=0.3
ai.title=adrian0511.dev
ai.host=${AI_HOST:https://adrian0511.dev}
# Con streaming el primer token llega rapido, asi que un timeout de
# inactividad corto es seguro y evita dejar al visitante esperando.
ai.read-timeout=25s
chat.max-messages-per-session=${CHAT_MAX_MESSAGES:20}
# Cookie de sesion: Secure solo donde hay HTTPS (en local se sirve por HTTP y el
# navegador descartaria la cookie). En Railway: SESSION_COOKIE_SECURE=true
session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# Cupos del chat: el de sesion es cortesia, los que protegen la cuota son el de
# IP y el diario global.
chat.max-messages-per-ip-per-hour=${CHAT_MAX_PER_IP:15}
# Y por dia: sin esto, 15/hora bastaban para que una sola red vaciara ella sola
# la cuota diaria del modelo (50 peticiones en el tier gratuito de OpenRouter) y
# dejara el chat mudo para el resto. Un visitante real no manda 20 en un dia.
chat.max-messages-per-ip-per-day=${CHAT_MAX_PER_IP_DAY:20}
chat.max-messages-per-day=${CHAT_MAX_PER_DAY:150}
