name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Una serie por rama: si llegan dos pushes seguidos, se cancela el anterior en
# vez de gastar minutos en un commit que ya está superado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Tests backend (JUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Preparar JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # El frontend se compila en su propio job; aquí se salta para que un fallo
      # de npm no enmascare el resultado de los tests de Java. La propiedad es
      # la del pom (-Dskip.frontend), no las del plugin: el pom fija <skip>
      # explícitamente, así que -Dskip.npm no tenía ningún efecto.
      - name: mvnw test
        run: ./mvnw -B test -Dskip.frontend=true

  frontend:
    name: Tests frontend (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - name: Comprobar que el build de producción sale
        run: npm run build

  package:
    name: Empaquetar jar
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # El build completo (compila React y lo mete en el jar) es lo que corre
      # Railway al desplegar: si esto pasa, el despliegue no debería sorprender.
      - name: mvnw package
        run: ./mvnw -B clean package
