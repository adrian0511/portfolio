# Este fichero son las SUBIDAS DE VERSION: los PR semanales con lo que haya
# salido nuevo. Los avisos de CVE no salen de aqui, son el interruptor
# "Dependabot alerts" de Settings -> Code security, que es aparte y estuvo
# apagado un tiempo: con el off, una dependencia vulnerable solo aparecia si a
# alguien se le ocurria lanzar `npm audit` o mirar el arbol de Maven a mano.
# Las "security updates" (los PR automaticos ante un CVE) se dejan APAGADAS a
# proposito: su lock lo escribe el npm de Dependabot, y eso no se puede mergear
# sin mas -ver el aviso de la entrada de npm, mas abajo-.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # prompt-link arrastra Spring Cloud OpenFeign, y su verificador de
      # compatibilidad aborta el arranque con Boot 4.1.x ("change to [4.0.x]").
      # Los parches de la 4.0.x -que son los que traen los arreglos de
      # seguridad- si interesan; subir de linea no, hasta que prompt-link vaya
      # con un release train compatible.
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Ojo al traerse un PR de npm: el package-lock.json hay que regenerarlo con el
  # npm del build (el del nodeVersion del pom), no con el que lo haya escrito.
  # Un lock escrito por un npm mas nuevo pasa `npm test` y revienta `npm ci`.
  # El procedimiento esta en CLAUDE.md.
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Decision tomada, no pendiente: React 19 y Vitest 5 se quedan fuera por
      # ahora. React 19 cambia StrictMode y los refs de funcion (pasan a
      # devolver cleanup) y toca el runtime que ve el visitante, no solo el
      # build; Vitest 5 cambia config y matchers, con 67 tests detras. Y
      # ninguno de los dos aporta seguridad: npm audit esta en 0 desde Vite 8.
      # Los parches y minors de la linea actual si interesan, que son los que
      # traen los arreglos.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]

  # Las actions estan fijadas por tag mayor, asi que esto solo se mueve cuando
  # sale uno nuevo. Aqui no hay ignore a proposito: un salto de checkout o de
  # setup-java solo afecta al CI, asi que si rompe se ve antes de desplegar.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
